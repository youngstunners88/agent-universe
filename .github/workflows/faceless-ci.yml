name: Faceless engine CI

on:
  push:
    paths: ["faceless-studio/**", ".github/workflows/faceless-*.yml"]
  pull_request:
    paths: ["faceless-studio/**", ".github/workflows/faceless-*.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: faceless-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: faceless-studio/requirements.txt
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m pytest -q tests
      - name: Import every module
        run: python -c "import faceless.cli, faceless.orchestrator, faceless.pipeline.render, faceless.providers.publish"
      - name: Validate config and seed script
        run: |
          python -c "from faceless import config; c=config.load(); assert len(c['pillars'])==5; print('pillars ok')"
          python -c "import json,glob; [json.load(open(p)) for p in glob.glob('script-lab/final/*.json')]; print('scripts ok')"
